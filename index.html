<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong Game</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1 class="visually-hidden">Pong Game</h1>
    </header>
    <main role="main">
        <canvas id="gameCanvas" aria-label="Pong Game Canvas"></canvas>
        <div class="button-container">
            <button id="startButton" aria-label="Start Game">Start</button>
            <button id="pauseButton" aria-label="Pause Game">Pause</button>
            <button id="restartButton" aria-label="Restart Game">Restart</button>
        </div>
        <div id="gameOverScreen" role="dialog" aria-labelledby="winnerMessage">
            <h1 id="winnerMessage"></h1>
            <button id="playAgainButton" aria-label="Play Again">Play Again</button>
            <button id="mainMenuButton" aria-label="Main Menu">Main Menu</button>
        </div>
    </main>
    <footer>
        <audio id="bgMusic" loop>
            <source src="Original Tetris theme (Tetris Soundtrack).mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <audio id="scoreSound">
            <source src="http://localhost:8000/score.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <audio id="hitSound">
            <source src="hit.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </footer>
</body>
</html>
