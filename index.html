<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            border: 3px solid #4a4a5a;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
        }
        button {
            position: absolute;
            width: 90px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            font-size: 16px;
            font-family: 'Arial', sans-serif;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        #startButton { left: 20px; bottom: 20px; }
        #pauseButton { left: 50%; bottom: 20px; transform: translateX(-50%); }
        #restartButton { right: 20px; bottom: 20px; }
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #gameOverScreen h1 {
            font-size: 30px;
            margin-bottom: 20px;
            font-family: 'Arial', sans-serif;
        }
        #gameOverScreen button {
            margin: 15px;
            font-size: 18px;
            padding: 12px 24px;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="visually-hidden">Pong Game</h1>
    </header>
    <main role="main">
        <canvas id="gameCanvas" aria-label="Pong Game Canvas"></canvas>
        <button id="startButton" aria-label="Start Game">Start</button>
        <button id="pauseButton" aria-label="Pause Game">Pause</button>
        <button id="restartButton" aria-label="Restart Game">Restart</button>
        <div id="gameOverScreen" role="dialog" aria-labelledby="winnerMessage">
            <h1 id="winnerMessage"></h1>
            <button id="playAgainButton" aria-label="Play Again">Play Again</button>
            <button id="mainMenuButton" aria-label="Main Menu">Main Menu</button>
        </div>
    </main>
    <footer>
        <audio id="bgMusic" loop>
            <source src="audio/Original Tetris theme (Tetris Soundtrack).mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <audio id="scoreSound">
            <source src="audio/score.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <audio id="hitSound">
            <source src="audio/hit.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </footer>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const restartButton = document.getElementById('restartButton');
        const bgMusic = document.getElementById('bgMusic');
        const scoreSound = document.getElementById('scoreSound');
        const hitSound = document.getElementById('hitSound');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const winnerMessage = document.getElementById('winnerMessage');
        const playAgainButton = document.getElementById('playAgainButton');
        const mainMenuButton = document.getElementById('mainMenuButton');

        const BALL_RADIUS = 8;
        const PADDLE_WIDTH = 20;
        const PADDLE_HEIGHT = 80;
        const INITIAL_BALL_SPEED = 5;
        const PADDLE_SPEED = 5;
        const PARTICLE_COUNT = 30;
        const WINNING_SCORE = 10;
        const MAX_BALL_SPEED = 15;
        const POINTS_PER_LEVEL = 3;

        const BALL_COLOR = '#FFD700';
        const PADDLE_COLOR = '#00FA9A';
        const MIDDLE_LINE_COLOR = '#FFFFFF';

        let ballX, ballY, dx, dy;
        let leftPaddleY, rightPaddleY;
        let animationFrameId = null;
        let leftScore = 0, rightScore = 0;
        let ballMoving = false;
        let gamePaused = false;
        let leftTouch = false;
        let rightTouch = false;
        let currentLevel = 1;
        let particles = [];

        function initializeGame() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * (window.innerWidth < window.innerHeight ? 0.5 : 1);
            resetBall();
            leftPaddleY = rightPaddleY = (canvas.height - PADDLE_HEIGHT) / 2;
            drawScore();
        }

        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            dx = (Math.random() > 0.5 ? 1 : -1) * (INITIAL_BALL_SPEED + (currentLevel - 1) * 0.5);
            dy = (Math.random() > 0.5 ? 1 : -1) * (INITIAL_BALL_SPEED + (currentLevel - 1) * 0.5);
            ballMoving = false;
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = BALL_COLOR;
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle(x, y) {
            ctx.beginPath();
            ctx.rect(x, y, PADDLE_WIDTH, PADDLE_HEIGHT);
            ctx.fillStyle = PADDLE_COLOR;
            ctx.fill();
            ctx.closePath();
        }

        function drawMiddleLine() {
            ctx.beginPath();
            ctx.setLineDash([5, 15]);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = MIDDLE_LINE_COLOR;
            ctx.stroke();
            ctx.closePath();
        }

        function drawScore() {
            ctx.font = '20px Arial';
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`Left: ${leftScore} | Right: ${rightScore} | Level: ${currentLevel}`, canvas.width / 2, 20);
        }

        function updateBallPosition() {
            ballX += dx;
            ballY += dy;

            if (ballY + dy < BALL_RADIUS || ballY + dy > canvas.height - BALL_RADIUS) {
                dy = -dy;
            }

            if (ballX - BALL_RADIUS < 4 * PADDLE_WIDTH && ballY > leftPaddleY && ballY < leftPaddleY + PADDLE_HEIGHT) {
                dx = -Math.min(Math.abs(dx) * 1.05, MAX_BALL_SPEED) * Math.sign(dx);
                dy = Math.min(Math.abs(dy) * 1.05, MAX_BALL_SPEED) * Math.sign(dy);
                hitSound.currentTime = 0;
                hitSound.play();
                createParticles(ballX, ballY, BALL_COLOR);
            } else if (ballX + BALL_RADIUS > canvas.width - 5 * PADDLE_WIDTH && ballY > rightPaddleY && ballY < rightPaddleY + PADDLE_HEIGHT) {
                dx = -Math.min(Math.abs(dx) * 1.05, MAX_BALL_SPEED) * Math.sign(dx);
                dy = Math.min(Math.abs(dy) * 1.05, MAX_BALL_SPEED) * Math.sign(dy);
                hitSound.currentTime = 0;
                hitSound.play();
                createParticles(ballX, ballY, BALL_COLOR);
            }

            if (ballX + dx < 0) {
                rightScore++;
                scoreSound.currentTime = 0;
                scoreSound.play();
                checkLevelUp();
                checkGameOver();
                resetBall();
            } else if (ballX + dx > canvas.width) {
                leftScore++;
                scoreSound.currentTime = 0;
                scoreSound.play();
                checkLevelUp();
                checkGameOver();
                resetBall();
            }
            drawScore();
        }

        function checkLevelUp() {
            if ((leftScore + rightScore) % POINTS_PER_LEVEL === 0 && (leftScore + rightScore) > 0) {
                currentLevel++;
            }
        }

        function checkGameOver() {
            if (leftScore >= WINNING_SCORE || rightScore >= WINNING_SCORE) {
                gameOverScreen.style.display = 'flex';
                winnerMessage.textContent = leftScore >= WINNING_SCORE ? 'Left Player Wins!' : 'Right Player Wins!';
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                ballMoving = false;
                gamePaused = true;
                bgMusic.pause();
            }
        }

        function drawParticles() {
            particles.forEach((particle, index) => {
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${hexToRgb(particle.color)}, ${particle.alpha})`;
                ctx.fill();
                ctx.closePath();

                particle.x += particle.dx;
                particle.y += particle.dy;
                particle.alpha -= 0.02;
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.slice(1), 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `${r},${g},${b}`;
        }

        function draw() {
            if (gamePaused) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBall();
            drawPaddle(4 * PADDLE_WIDTH, leftPaddleY);
            drawPaddle(canvas.width - 5 * PADDLE_WIDTH, rightPaddleY);
            drawMiddleLine();
            drawParticles();

            if (ballMoving) {
                updateBallPosition();
            }

            updateAIPaddle();
            animationFrameId = requestAnimationFrame(draw);
        }

        function startGame() {
            if (!ballMoving) {
                ballMoving = true;
                if (!animationFrameId) animationFrameId = requestAnimationFrame(draw);
                bgMusic.play();
            }
            if (gamePaused) {
                gamePaused = false;
                pauseButton.textContent = 'Pause';
                bgMusic.play();
            }
        }

        function pauseGame() {
            gamePaused = !gamePaused;
            pauseButton.textContent = gamePaused ? 'Resume' : 'Pause';
            if (gamePaused) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                bgMusic.pause();
            } else {
                if (!animationFrameId) animationFrameId = requestAnimationFrame(draw);
                bgMusic.play();
            }
        }

        function restartGame() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            resetBall();
            leftPaddleY = rightPaddleY = (canvas.height - PADDLE_HEIGHT) / 2;
            leftScore = 0;
            rightScore = 0;
            currentLevel = 1;
            drawScore();
            ballMoving = false;
            gamePaused = false;
            pauseButton.textContent = 'Pause';
            gameOverScreen.style.display = 'none';
            if (!animationFrameId) animationFrameId = requestAnimationFrame(draw);
            bgMusic.play();
        }

        function updateAIPaddle() {
            const aiPaddleCenter = rightPaddleY + PADDLE_HEIGHT / 2;
            const ballCenter = ballY;

            if (ballX > canvas.width / 2 && !gamePaused) {
                if (ballCenter > aiPaddleCenter + PADDLE_SPEED) {
                    rightPaddleY += PADDLE_SPEED;
                } else if (ballCenter < aiPaddleCenter - PADDLE_SPEED) {
                    rightPaddleY -= PADDLE_SPEED;
                }
                rightPaddleY = Math.max(Math.min(rightPaddleY, canvas.height - PADDLE_HEIGHT), 0);
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 4,
                    dy: (Math.random() - 0.5) * 4,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        startButton.addEventListener('click', startGame);
        pauseButton.addEventListener('click', pauseGame);
        restartButton.addEventListener('click', restartGame);

        playAgainButton.addEventListener('click', restartGame);
        mainMenuButton.addEventListener('click', () => {
            window.location.reload();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowUp') {
                leftPaddleY = Math.max(leftPaddleY - PADDLE_SPEED * 2, 0);
            } else if (e.key === 'ArrowDown') {
                leftPaddleY = Math.min(leftPaddleY + PADDLE_SPEED * 2, canvas.height - PADDLE_HEIGHT);
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            if (x < canvas.width / 2) {
                leftTouch = true;
                leftPaddleY = Math.max(Math.min(y - PADDLE_HEIGHT / 2, canvas.height - PADDLE_HEIGHT), 0);
            } else {
                rightTouch = true;
                rightPaddleY = Math.max(Math.min(y - PADDLE_HEIGHT / 2, canvas.height - PADDLE_HEIGHT), 0);
            }

            if (!ballMoving) {
                ballMoving = true;
                if (!animationFrameId) animationFrameId = requestAnimationFrame(draw);
                bgMusic.play();
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const y = touch.clientY - rect.top;

            if (leftTouch) {
                leftPaddleY = Math.max(Math.min(y - PADDLE_HEIGHT / 2, canvas.height - PADDLE_HEIGHT), 0);
            } else if (rightTouch) {
                rightPaddleY = Math.max(Math.min(y - PADDLE_HEIGHT / 2, canvas.height - PADDLE_HEIGHT), 0);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            leftTouch = false;
            rightTouch = false;
        }, { passive: false });

        window.addEventListener('resize', initializeGame);
        initializeGame();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(registration => {
                    console.log('Service Worker registered with scope:', registration.scope);
                })
                .catch(error => {
                    console.log('Service Worker registration failed:', error);
                });
        }
    </script>
</body>
</html>
