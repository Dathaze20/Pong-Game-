<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pong Game</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1 class="visually-hidden">Pong Game</h1>
    </header>
    <main role="main">
        <div id="mainMenu" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
            <h1 style="font-size: 36px; color: #FFD700;">Pong Game</h1>
            <input id="player1NameInput" type="text" placeholder="Enter Player 1 Name" style="margin: 10px; padding: 10px; font-size: 16px;" />
            <input id="player2NameInput" type="text" placeholder="Enter Player 2 Name" style="margin: 10px; padding: 10px; font-size: 16px;" />
            <select id="gameMode" style="margin: 10px; padding: 10px; font-size: 16px;">
                <option value="1">1 Player (vs AI)</option>
                <option value="2">2 Players</option>
            </select>
            <button id="startGameButton" style="margin: 10px;">Start Game</button>
            <button id="settingsButton" style="margin: 10px;">Settings</button>
            <button id="exitButton" style="margin: 10px;">Exit</button>
        </div>
        <canvas id="gameCanvas" aria-label="Pong Game Canvas" style="display: none;"></canvas>
        <div class="button-container" style="display: none;">
            <button id="startButton" aria-label="Start Game">Start</button>
            <button id="pauseButton" aria-label="Pause Game">Pause</button>
            <button id="restartButton" aria-label="Restart Game">Restart</button>
        </div>
        <div id="gameOverScreen" role="dialog" aria-labelledby="winnerMessage" style="display: none;">
            <h1 id="winnerMessage"></h1>
            <button id="playAgainButton" aria-label="Play Again">Play Again</button>
            <button id="mainMenuButton" aria-label="Main Menu">Main Menu</button>
        </div>
    </main>
    <footer>
        <audio id="bgMusic" loop>
            <source src="Original Tetris theme (Tetris Soundtrack).mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <audio id="scoreSound">
            <source src="http://localhost:8000/score.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <audio id="hitSound">
            <source src="hit.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </footer>
    <script>
        document.getElementById('startGameButton').addEventListener('click', () => {
            const player1Name = document.getElementById('player1NameInput').value || 'Player 1';
            const player2Name = document.getElementById('player2NameInput').value || 'Player 2';
            const gameMode = document.getElementById('gameMode').value;

            localStorage.setItem('player1Name', player1Name);
            localStorage.setItem('player2Name', player2Name);
            localStorage.setItem('gameMode', gameMode);

            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('gameCanvas').style.display = 'block';
            document.querySelector('.button-container').style.display = 'flex';
        });
    </script>
</body>
</html>
