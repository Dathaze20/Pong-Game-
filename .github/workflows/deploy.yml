name: Test and Deploy Pong Game

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This is a static site (no bundler) - the game runs directly from
      # index.html/style.css/script.js, so we publish the repo as-is.
      #
      # This pushes straight to the gh-pages branch instead of using the
      # newer Actions-based Pages deployment (actions/deploy-pages), because
      # that method requires Pages to already be enabled via the "GitHub
      # Actions" source in the repo's Settings - the default GITHUB_TOKEN
      # cannot enable it for the first time (its Pages-creation API call
      # gets "Resource not accessible by integration" on a repo that's never
      # had that source configured). Pushing to gh-pages only needs
      # contents: write, so it works out of the box.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,node_modules,tests,.gitignore,eslint.config.js,package-lock.json,package.json'
